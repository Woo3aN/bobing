<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body style="background:#111;color:#8f8;font:13px monospace">
<pre id="out">…</pre>
<script>
/* 托管/取消按钮专项验证（用户 2026-09-19 实测两轮的问题）：
   1. 轮次方「页面开着但不动」→ 15 秒（此处 idlems=1200）判定托管 → **本人按钮必须是「取消代博」**
   2. 点它 → 真正取消（auto 清零）+ 按钮变回正常
   3. 代博把数涨到 ≥5 后 → 按钮是「取消自动跳过」 */
const out = document.getElementById('out');
const log = m => { out.textContent += '\n' + m; console.log('[AUTO] ' + m); };
const fail = m => { log('=== 失败: ' + m + ' ==='); throw new Error(m); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
function mkFrame() {
  const f = document.createElement('iframe');
  const loaded = new Promise(r => { f.onload = r; });
  f.src = '/index.html?wstimeout=600000&idlems=1200&ws=' + encodeURIComponent((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  f.style.cssText = 'width:430px;height:620px;border:0;visibility:hidden;position:absolute';
  document.body.appendChild(f);
  return { f: f, loaded: loaded };
}
(async () => {
  try {
    const a1 = mkFrame(), a2 = mkFrame();
    await Promise.all([a1.loaded, a2.loaded]);
    await sleep(500);
    const g1 = a1.f.contentWindow.__game, g2 = a2.f.contentWindow.__game;
    const N1 = g1.net._raw(), N2 = g2.net._raw();
    N1._fast(true); N2._fast(true);
    const created = await new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('create 超时')), 20000);
      N1.create('甲', (e, r) => { clearTimeout(t); e ? rej(new Error(e)) : res(r); });
    });
    await new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('join 超时')), 20000);
      N2.join(created.code, '乙', (e) => { clearTimeout(t); e ? rej(new Error(e)) : res(); });
    });
    N1.start(true, function () {});
    let inGame = 0;
    for (let i = 0; i < 30; i++) { await sleep(400); inGame = (g1.state() && g1.state().online ? 1 : 0) + (g2.state() && g2.state().online ? 1 : 0); if (inGame === 2) break; }
    if (inGame !== 2) fail('未进入对局');
    log('[1] 开局 ✓ 房间 ' + created.code);

    /* 让轮次方静置：两侧都不驱动 → 它的 idlems(1.2s) 到期 → 自己把自己托管（代博 s=自己） */
    const seat = g1.state().current;
    const gSelf = seat === 0 ? g1 : g2, gOther = seat === 0 ? g2 : g1;
    const NA = seat === 0 ? N1 : N2;
    const fSelf = seat === 0 ? a1.f : a2.f;
    const btn = () => fSelf.contentDocument.getElementById('btn-roll').textContent;
    let txt = '';
    for (let k = 0; k < 30; k++) {
      await sleep(500);
      if (gOther.state().busy) gOther.skipAnim();
      txt = btn();
      if (/取消代博|取消自动跳过/.test(txt)) break;
    }
    if (!/取消代博|取消自动跳过/.test(txt)) fail('被托管时本人按钮不是取消入口，实际：' + txt);
    log('[2] 被托管时本人按钮 =「' + txt + '」✓');
    if (!/取消代博（\d\/5）/.test(txt) && !/取消自动跳过/.test(txt)) fail('文案格式异常：' + txt);

    /* 点它 → 真正取消：auto[自己] 清零 + 按钮回正常 */
    fSelf.contentDocument.getElementById('btn-roll').click();
    await sleep(1200);
    const cntAfter = NA.autoCount(seat);
    if (cntAfter > 0) fail('点了取消但托管状态还在 cnt=' + cntAfter);
    const txt2 = btn();
    if (/取消代博|取消自动跳过/.test(txt2)) fail('取消后按钮仍是取消入口：' + txt2);
    log('[3] 点击取消 → 托管状态清零 ✓ 按钮变回「' + txt2 + '」✓');

    /* 再静置一次 → 应重新托管（15 秒判定，idlems=1.2s）→ 按钮再变取消入口（可反复夺回） */
    let txt3 = '';
    for (let k = 0; k < 30; k++) {
      await sleep(500);
      if (gOther.state().busy) gOther.skipAnim();
      txt3 = btn();
      if (/取消代博|取消自动跳过/.test(txt3)) break;
    }
    if (!/取消代博|取消自动跳过/.test(txt3)) fail('取消后不动没有重新托管（或按钮不可点）：' + txt3);
    log('[4] 再发呆 → 重新托管，按钮再次是「' + txt3 + '」✓（随时都能再夺回）');

    /* [5] 跑到满 5 把（跳过阶段）→ 按钮必须是「取消自动跳过」且可点 → 点击即取消 */
    let txt5 = '';
    for (let k = 0; k < 60; k++) {
      await sleep(700);
      if (gOther.state().busy) gOther.skipAnim();
      txt5 = btn();
      if (/取消自动跳过/.test(txt5)) break;
    }
    if (!/取消自动跳过/.test(txt5)) fail('满 5 把后按钮不是「取消自动跳过」，实际：' + txt5);
    log('[5] 跳过阶段本人按钮 =「' + txt5 + '」✓');
    /* 先直接调协议层验证服务端链路（排除 UI） */
    NA.sendCancel(seat);
    await sleep(1000);
    log('[5d] 直接 sendCancel 后 autoCount(me)=' + NA.autoCount(seat) + '（应为 0）');
    /* 再走 UI 点击路径（会被重新托管后再点） */
    fSelf.contentDocument.getElementById('btn-roll').click();
    await sleep(400);
    log('[5d] UI 点击后 400ms：autoCount(me)=' + NA.autoCount(seat) + ' 按钮=' + btn());
    await sleep(1200);
    if (NA.autoCount(seat) > 0) fail('跳过阶段点取消无效，cnt=' + NA.autoCount(seat));
    const txt6 = btn();
    if (/取消自动跳过|取消代博/.test(txt6)) fail('取消后按钮仍是取消入口：' + txt6);
    log('[6] 跳过阶段点取消 → 托管清零 ✓ 按钮变回「' + txt6 + '」✓');

    /* [7] 超过彻底断线窗口后：本人也不再能取消（服务端拒绝），按钮显示"已被移出本局"
       （2026-09-19 用户实测发现：人还在页面也不能复活）。
       用测试钩子把客户端时限调到 2.5 秒（与 mock 的 OFFLINE_MS=2000 对齐），
       不能走 URL 参数——那会在 [2]-[6] 阶段就生效、把正常托管流程吃掉。 */
    if (g1.contentWindow) { }                                  /* 占位：保持结构清晰 */
    [a1.f, a2.f].forEach(function (fr) {
      if (fr.contentWindow && fr.contentWindow.__setOfflineMs) fr.contentWindow.__setOfflineMs(2500);
    });
    NA.sendCancel(seat);                 /* 先取消干净，进入"没人动"状态 */
    await sleep(300);
    let txt7 = '';
    for (let k = 0; k < 40; k++) {       /* 等托管 + 超过窗口 */
      await sleep(700);
      if (gOther.state().busy) gOther.skipAnim();
      if (gSelf.state().busy) gSelf.skipAnim();
      txt7 = btn();
      if (k % 5 === 0) log('[7d] t=' + (k * 0.7).toFixed(1) + 's cnt=' + NA.autoCount(seat) +
        ' at=' + NA.autoAt(seat) + ' 距今=' + (NA.autoAt(seat) ? ((Date.now() - NA.autoAt(seat)) / 1000).toFixed(1) + 's' : '-') +
        ' 按钮=' + txt7);
      if (/已被移出/.test(txt7)) break;
    }
    if (!/已被移出/.test(txt7)) fail('超时后本人按钮没有变成"已被移出"，实际：' + txt7);
    log('[7] 超过彻底断线窗口 → 本人按钮 =「' + txt7 + '」✓（不能复活）');
    const cntPre = NA.autoCount(seat);
    fSelf.contentDocument.getElementById('btn-roll').click();   /* 再点也没用 */
    await sleep(800);
    if (NA.autoCount(seat) !== cntPre) fail('被移出后点击仍改变了托管状态 cnt=' + NA.autoCount(seat) + ' (was ' + cntPre + ')');
    log('[8] 被移出后点击不再生效（托管状态不变）✓');
    log('=== 托管/取消按钮验证通过 ===');
  } catch (e) { log('异常: ' + (e && e.message)); }
})();
</script></body></html>
