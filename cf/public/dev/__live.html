<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body style="background:#111;color:#8f8;font:13px monospace">
<pre id="out">…</pre>
<script>
/* 线上自动化验证（跑在 woo3an.top 同源下）：掉线 → 自动代博 → 自动恢复。
   与 mock e2e 的差异：真实 Worker + 真实 wss；__kick 不存在 → 用 wantClose + sock.close() 模拟长掉线。 */
const out = document.getElementById('out');
const log = m => { out.textContent += '\n' + m; console.log('[LIVE] ' + m); };
const fail = m => { log('=== 失败: ' + m + ' ==='); throw new Error(m); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(fn, ms) {
  const lim = ms || 15000, t0 = Date.now();
  while (Date.now() - t0 < lim) { if (fn()) return true; await sleep(150); }
  return fn();
}
function mkFrame() {
  const f = document.createElement('iframe');
  const loaded = new Promise(r => { f.onload = r; });
  f.src = '/index.html?wstimeout=600000&idlems=1000&ws=' + encodeURIComponent('wss://' + location.host + '/ws');
  f.style.cssText = 'width:430px;height:620px;border:0;visibility:hidden;position:absolute';
  document.body.appendChild(f);
  return { f: f, loaded: loaded };
}
(async () => {
  try {
    const a1 = mkFrame(), a2 = mkFrame();
    await Promise.all([a1.loaded, a2.loaded]);
    await sleep(500);
    const g1 = a1.f.contentWindow.__game, g2 = a2.f.contentWindow.__game;
    if (!g1 || !g2) fail('__game 未就绪');
    const N1 = g1.net._raw(), N2 = g2.net._raw();
    log('[1] 两实例就绪');
    const created = await new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('create 超时')), 20000);
      N1.create('阿澈', (e, r, kind) => { clearTimeout(t); e ? rej(new Error(e)) : res(r); });
    });
    log('[2] 建房 ' + created.code + ' 传输层=' + (g1.net.kind && g1.net.kind()));
    await new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('join 超时')), 20000);
      N2.join(created.code, 'WooSaN', (e) => { clearTimeout(t); e ? rej(new Error(e)) : res(); });
    });
    log('[3] 加入 OK');
    N1._fast(true); N2._fast(true);
    await new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('start 超时')), 20000);
      N1.start(true, (e) => { clearTimeout(t); e ? rej(new Error(e)) : res(); });
    });
    let inGame = 0;
    for (let i = 0; i < 30; i++) { await sleep(500); inGame = (g1.state() && g1.state().online ? 1 : 0) + (g2.state() && g2.state().online ? 1 : 0); if (inGame === 2) break; }
    if (inGame !== 2) fail('两端未都进入对局');
    log('[4] 开局 ✓');
    /* 博 1 把 */
    let cur = g1.state().current;
    (cur === 0 ? g1 : g2).doRoll(null, false);
    for (let k = 0; k < 20; k++) { await sleep(400); if (g1.state().busy) g1.skipAnim(); if (g2.state().busy) g2.skipAnim(); if (g1.state().rollCount === 1 && g2.state().rollCount === 1 && !g1.state().busy && !g2.state().busy) break; }
    if (g1.state().rollCount !== 1) fail('第 1 把未同步 rc=' + g1.state().rollCount);
    log('[5] 第 1 把同步 ✓');
    /* 掐掉轮次方（长掉线：wantClose 禁自动重连 + 主动 close socket） */
    const deadSeat = g1.state().current;
    const deadG = deadSeat === 0 ? g1 : g2, liveG = deadSeat === 0 ? g2 : g1;
    const deadN = deadSeat === 0 ? N1 : N2, liveN = deadSeat === 0 ? N2 : N1;
    const deadF = deadSeat === 0 ? a1.f : a2.f;
    deadN._ws().wantClose = true;
    try { deadN._ws().sock.close(); } catch (e) {}
    log('[6] 已掐断 seat ' + deadSeat + '（禁重连）');
    /* 按钮 → 「代博中」 */
    const btn = (deadSeat === 0 ? a2.f : a1.f).contentDocument.getElementById('btn-roll');
    let btnTxt = '';
    for (let k = 0; k < 24; k++) { await sleep(500); btnTxt = btn.textContent; if (btnTxt.indexOf('代博中') >= 0) break; }
    if (btnTxt.indexOf('代博中') < 0) fail('按钮未变「代博中」，实际：' + btnTxt);
    log('[7] 按钮自动变「' + btnTxt + '」✓');
    /* 自动代博：rc 推进且带 a 标记 */
    const rc0 = g1.state().rollCount;
    const autoOk = await waitFor(() => g1.state().rollCount > rc0, 12000);
    if (!autoOk) fail('自动代博未发生 rc=' + g1.state().rollCount);
    const cnt = N1.autoCount(deadSeat);
    if (cnt < 1) fail('代博事件无 a 标记 autoCount=' + cnt);
    log('[8] 自动代博生效 rc=' + g1.state().rollCount + ' autoCount=' + cnt + ' ✓');
    /* 自动跳过（满 5 后）+ 恢复 */
    deadN._ws().wantClose = false;
    deadN._ws().reconnect();
    let back = false;
    for (let k = 0; k < 40; k++) {
      await sleep(500);
      if (deadG.state()) { if (deadG.state().busy) deadG.skipAnim(); }
      if (liveG.state()) { if (liveG.state().busy) liveG.skipAnim(); }
      if (deadG.state() && liveG.state() && deadG.state().rollCount === liveG.state().rollCount && !deadG.state().busy) { back = true; break; }
    }
    if (!back) fail('重连后未追平 rc=' + (deadG.state() && deadG.state().rollCount) + '/' + (liveG.state() && liveG.state().rollCount));
    log('[9] 重连追平，两端 rc=' + liveG.state().rollCount + ' ✓');
    log('=== 线上自动化全部通过 ===');
  } catch (e) {
    log('异常: ' + (e && e.message));
  }
})();
</script></body></html>
